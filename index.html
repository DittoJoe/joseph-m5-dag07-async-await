<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dag 7 – Ladda med tillstånd</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    #status { padding: 1rem; border-radius: 8px; background: #f4f4f4; min-height: 3rem; }
    #status.laddar { background: #eef3fb; color: #16305c; }
    #status.fel { background: #fdecea; color: #7a1010; }
    #status.tomt { background: #fbeae0; }
    button { font: inherit; padding: 8px 16px; cursor: pointer; }
    label { display: block; }
  </style>
  <script type="module" src="demo.js"></script>
</head>
<body>
  <h1>Dag 7: Ladda menyn med tillstånd</h1>
  <p>Den här sidan använder din <code>laddaMeny</code> från <code>api.js</code>. Den fungerar när du skrivit klart funktionen.</p>
  <label><input type="checkbox" id="simulera-fel"> Simulera fel</label>
  <label><input type="checkbox" id="simulera-tomt"> Simulera tom lista</label>
  <p><button type="button" id="ladda">Ladda menyn</button></p>
  <div id="status" role="status" aria-live="polite">Tryck på knappen.</div>
</body>
</html>
